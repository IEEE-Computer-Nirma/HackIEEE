<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background space gradient -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140d07"/>
      <stop offset="85%" stop-color="#080604"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>

    <!-- Planetary atmosphere outer glow -->
    <filter id="corona-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Planet dark body -->
    <radialGradient id="planet-body" cx="38%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#24170e"/>
      <stop offset="45%" stop-color="#150e08"/>
      <stop offset="85%" stop-color="#0a0604"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>

    <!-- Golden sunlit crescent edge -->
    <linearGradient id="crescent-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#ffeacc"/>
      <stop offset="45%" stop-color="#ffa64d"/>
      <stop offset="75%" stop-color="#e2822f"/>
      <stop offset="100%" stop-color="#a6440f"/>
    </linearGradient>

    <!-- Orbital ring gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa64d" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#ffb770" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#ffa64d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffa64d" stop-opacity="0"/>
    </linearGradient>

    <!-- Atmospheric crescent mask -->
    <mask id="crescent-mask">
      <circle cx="256" cy="256" r="170" fill="#ffffff"/>
      <circle cx="230" cy="272" r="162" fill="#000000"/>
    </mask>
  </defs>

  <!-- Deep space background rounded container for Google search badge -->
  <rect width="512" height="512" rx="112" fill="url(#space-bg)"/>

  <!-- Back half of orbital ring -->
  <g transform="rotate(-26 256 256)">
    <ellipse cx="256" cy="256" rx="230" ry="52" fill="none" stroke="url(#orbit-grad)" stroke-width="4.5" stroke-dasharray="320 400" stroke-dashoffset="180" opacity="0.4"/>
  </g>

  <!-- Atmosphere outer glow corona behind the planet -->
  <ellipse cx="280" cy="232" rx="172" ry="172" fill="#ff9033" opacity="0.38" filter="url(#corona-glow)"/>
  <ellipse cx="290" cy="224" rx="160" ry="160" fill="#ffbe6b" opacity="0.25" filter="url(#corona-glow)"/>

  <!-- Main dark planet sphere -->
  <circle cx="256" cy="256" r="168" fill="url(#planet-body)"/>

  <!-- Golden illuminated crescent limb (The Eclipse) -->
  <circle cx="256" cy="256" r="168" fill="url(#crescent-sun)" mask="url(#crescent-mask)"/>

  <!-- Ultra-bright specular crest on top-right horizon -->
  <ellipse cx="330" cy="180" rx="48" ry="12" transform="rotate(-38 330 180)" fill="#ffffff" opacity="0.65" filter="url(#corona-glow)"/>

  <!-- Front half of orbital ring crossing over planet -->
  <g transform="rotate(-26 256 256)">
    <ellipse cx="256" cy="256" rx="230" ry="52" fill="none" stroke="url(#orbit-grad)" stroke-width="5.5" stroke-dasharray="320 400" stroke-dashoffset="0"/>
    <!-- Specular orbit bead / satellite star -->
    <circle cx="390" cy="274" r="7" fill="#ffffff" filter="url(#corona-glow)"/>
    <circle cx="390" cy="274" r="3.5" fill="#ffffff"/>
  </g>
</svg>
